# https configuration
server:
  port: 8443
  ssl:
    key-store: classpath:keystore.jks
    key-store-password: password
    key-password: password

spring:
  application:
    name: trainfyre-app-service
  banner:
    location: banner.txt

  # Mustache
  mustache:
    suffix: .html
    servlet:
      expose-request-attributes: true

  # H2 Console
  autoconfigure:
    exclude:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # Datasource H2 en memoria
  datasource:
    url: jdbc:h2:mem:trainfyre
    driver-class-name: org.h2.Driver
    username: admin
    password:

  # JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  # Sesion, de momento no se usa
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
        http-only: true
        same-site: strict

# Configuration for the email service de trainfyre-utility-service
email:
  service:
    url: http://localhost:8080

#    Swagger UI configuration
springdoc:
  swagger-ui:
    path: /trainfyre-app-service/swagger-ui.html

# Logging configuration
logging:
  level:
    org:
      springframework:
        security: DEBUG
        web: DEBUG
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE