# https configuration
server:
  port: 8443
  ssl:
    key-store: classpath:keystore.jks
    key-store-password: password
    key-password: password

spring:
  application:
    name: trainfyre-app-service
  banner:
    location: banner.txt

  # Mustache
  mustache:
    suffix: .html
    servlet:
      expose-request-attributes: true

  # H2 Console
  autoconfigure:
    exclude:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # Datasource MySQL
  datasource:
      url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/trainfyre}
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: ${DB_USERNAME:user}
      password: ${DB_PASSWORD:pass}


  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  # Sesion, de momento no se usa
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
        http-only: true
        same-site: strict

# Configuration for the email service de trainfyre-utility-service
email:
  service:
    url: ${EMAIL_SERVICE_URL:http://localhost:8080}

#    Swagger UI configuration
springdoc:
  swagger-ui:
    path: /trainfyre-app-service/swagger-ui.html

# Logging configuration
logging:
  level:
    org:
      springframework:
        security: DEBUG
        web: DEBUG
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE